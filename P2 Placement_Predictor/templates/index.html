<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Placement Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h1 class="text-center text-primary mb-4">
            Student Placement Predictor
        </h1>

        <form action="/predict" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    CGPA
                </label>

                <input type="number"
                       step="0.01"
                       name="cgpa"
                       class="form-control"
                       placeholder="Enter CGPA"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    IQ
                </label>

                <input type="number"
                       name="iq"
                       class="form-control"
                       placeholder="Enter IQ"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Profile Score
                </label>

                <input type="number"
                       name="profile_score"
                       class="form-control"
                       placeholder="Enter Profile Score"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Predict Placement

            </button>

        </form>

        {% if result %}

        <div class="alert alert-success mt-4">

            <h3>
                Prediction: {{ result }}
            </h3>

        </div>

        {% endif %}

        {% if error %}

        <div class="alert alert-danger mt-4">

            {{ error }}

        </div>

        {% endif %}

    </div>

    <div class="card shadow mt-4 p-4">

        <h2 class="mb-3">
            Last 5 Predictions
        </h2>

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>CGPA</th>
                    <th>IQ</th>
                    <th>Profile Score</th>
                    <th>Prediction</th>

                </tr>

            </thead>

            <tbody>

                {% for row in history %}

                <tr>

                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
